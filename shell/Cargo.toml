[package]
name = "lintel"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2.5"
cairo-rs = "0.21.5"
gio = { version = "0.21.5", features = ["v2_72"] }
gob = "0.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
memmap2 = "0.9"
pango = "0.21.5"
pangocairo = "0.21.5"
rustbg = { path = ".." }
rustix = { version = "1.1.5", features = ["event", "fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_schema = "0.0.1"
serde_schema_derive = "0.0.1"
wayland-client = "0.31.14"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
xkbcommon = { version = "0.9", default-features = false }

[profile.release]
lto = "thin"
strip = true
